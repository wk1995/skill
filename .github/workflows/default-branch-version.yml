name: Default branch version policy

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate-versions:
    name: default-branch-version
    # Creation has no previous branch revision; deletion has no resulting tree.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && !github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require one-step upgrades across the entire push
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: python3 scripts/version_guard.py --mode push --base "$BEFORE_SHA" --head "$AFTER_SHA"
