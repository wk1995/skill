# Copy to .release/code-release-train.yml and replace every placeholder before enabling writes.
repository:
  default_branch: TODO # Resolve from repository metadata; never assume main or master.
  github_app:
    app_id_secret: RELEASE_BOT_APP_ID
    private_key_secret: RELEASE_BOT_PRIVATE_KEY

branches:
  requirement_prefixes: [feature/, bugfix/]
  # Integration branch. integration_template is the only name source;
  # {version} is major.minor.patch, so 5.1.3 becomes dev_5.1.3.
  integration_template: dev_{version}
  # Visible pull-request branch. publish_template is the only name source;
  # {version} is major.minor.patch. A repository may replace the template.
  publish_template: publish_{version}
  publish_protected: true
  publish_direct_push: false
  # Separate PR source for a protected default branch; the hidden candidate
  # remains outside PRs. Start this branch from the exact recorded candidate.
  finalization_template: finalize_{version}
  # Hidden candidate created by rebasing the merged publish branch onto the
  # default branch. Remove after failure before tagging, or after verified
  # finalization. Retain after tagging until ancestry verification passes.
  release_candidate_template: release-candidate/{version}/{attempt}
  release_candidate_visible: false
  delete_release_candidate_after_attempt: true
  tag_prefix: v

source:
  version_sources: [] # Discover repository-owned version files and keys; do not assume a language or property name.
  # Exactly three canonical integers: major.minor.patch, such as 5.1.3.
  # 0 is valid; a component with a leading zero, such as 1.01.0, is not.
  version_identifier: major.minor.patch
  version_policy: TODO
  initialize_versions_on_integration_creation: true
  record_default_branch_baseline: true
  # An optional repository helper may implement initialization. Without one,
  # use equivalent Git/file operations under the configured version policy.

code_gates:
  requirement: [lint, unit-test, compile-check]
  integration: [full-lint, full-unit-test, integration-test]
  publish: [publish-lint, publish-unit-test, source-review]
  candidate: [publish-lint, publish-unit-test, source-review]
  finalization: [publish-lint, publish-unit-test, source-review]
  required_reviewers: 1

source_release:
  rebase_publish_onto_default: true
  push_rebased_publish_branch: false
  push_hidden_release_candidate: true
  default_merge_requires_pr: true
  resume_recorded_candidate_on_retry: true
  check_existing_remote_tag_before_packaging: true
  durable_attempt_record: required
  retain_candidate_objects_and_packages_for_retry: true
  # Apply a permitted build-number change only on the hidden candidate,
  # after the rebase and before packaging, then require the gates again.
  build_number_adjustment: after-rebase
  require_gates_after_rebase: true
  require_gates_after_build_number_adjustment: true
  # A repository-defined package must exist. Missing, failed, or never-run
  # packages block the tag and default-branch merge. No defined package flow
  # may merge without a tag. build-pipeline-engineering supplies packaging.
  package_implementation: build-pipeline-engineering
  package_evidence:
    android: [apk, aab]
    windows: [exe, msi, msix, zip]
    macos: [dmg, pkg, app-zip]
    ios: [ipa]
  package_pass_without_definition: merge-without-tag
  package_missing_defined_output: fail
  # GitHub Actions Artifacts is the only destination named by this Skill.
  default_publish_implementation: github-actions-artifacts
  publish_implementations: []
  # A configured list replaces the fallback. One configured success passes
  # under 'any'; repositories can explicitly require 'all'.
  publish_success_policy: any
  # A retry of the same commit skips destinations already recorded as successful.
  publish_idempotent: true
  tag_after_publish: true
  merge_candidate_to_default: true
  tag_exact_published_commit: true
  # Enforce on the protected default-branch path before packaging/publication.
  # A true fast-forward is allowed only when repository policy permits it.
  default_merge_methods: [merge-commit, fast-forward]
  reject_rewriting_default_merge: true # No squash, rebase-and-merge, or cherry-pick.
  verify_remote_tag_matches_published_commit: true
  verify_tag_ancestor_of_fetched_default: true
  require_finalization_check_before_completion_and_cleanup: true
  # A failed merge after tagging keeps the tag and all branches, then continues
  # through a protected PR. The tag is not deleted or recreated.
  retain_tag_on_merge_failure: true
  retain_branches_on_merge_failure: true
  retain_branches_on_finalization_check_failure: true
  recreate_tag_on_merge_failure: false
  # Delete dev_<version> only after the tag is verified and the default-branch
  # merge has succeeded. Keep it when publication fails so repair can start there.
  delete_integration_after_promotion: false
  delete_integration_after_default_merge: true
  delete_finalization_after_verified_merge: true
  delete_visible_publish_branch: false

# build-pipeline-engineering implements packaging. Each entry above names a
# publish implementation; this train invokes the interface and does not embed
# destination-specific upload logic.
