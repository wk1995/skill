<!doctype html><meta charset="utf-8"><title>Three-view workbench regression</title><h1>Disposable three-view checks</h1><pre id="result">Running…</pre><iframe id="app" style="width:100%;height:1050px" title="Isolated three-view fixture"></iframe>
<script type="module">
import {openStore,read,update} from '../assets/workbench/store.mjs';import * as m from '../assets/workbench/model.mjs';
const frame=document.getElementById('app'),out=document.getElementById('result'),lines=[],workspace=`separation-${crypto.randomUUID()}`,db=await openStore(`ci-package-test-workbench:${workspace}`);const check=(ok,text)=>{if(!ok)throw new Error(text);};
async function until(fn){for(let i=0;i<300;i++){if(await fn()&&frame.contentDocument?.documentElement.dataset.busy!=='true')return;await new Promise(r=>setTimeout(r,20));}throw new Error('Timed out');}
const fill=(form,name,value)=>{form.elements[name].value=value;form.elements[name].dispatchEvent(new Event('input',{bubbles:true}));};
try{const fixture=await(await fetch('../assets/examples/archive.json')).json();await update(db,0,s=>m.importArchive(s,fixture));frame.src=`../assets/workbench/?workspace=${workspace}#plan=EXAMPLE-PLAN&round=EXAMPLE-ROUND&case=LOGIN01&environment=EXAMPLE-ENV`;await until(()=>frame.contentDocument?.querySelector('#detail h2'));let doc=frame.contentDocument;const before=JSON.stringify(await read(db));
check(!doc.getElementById('annotation-panel').open,'Case annotations obscure definition by default');check(!doc.querySelector('#observation-form')&&doc.getElementById('test-conclusion').hidden&&!doc.getElementById('flow').hidden,'Cases mixed with execution or summary');lines.push('PASS cases show definitions and graph without result forms or summary');
doc.querySelector('.stat[data-status=failed]').click();check(doc.getElementById('status').value==='failed'&&doc.querySelectorAll('.case-row').length===1&&doc.querySelector('.stat[data-status=failed]').getAttribute('aria-pressed')==='true','Statistics did not filter/highlight');check(doc.querySelector('.case-row').textContent.includes('PROFILE01'),'Wrong status case');doc.getElementById('status').value='passed';doc.getElementById('status').dispatchEvent(new Event('input'));check(doc.querySelector('.stat[data-status=passed]').getAttribute('aria-pressed')==='true','Dropdown did not synchronize stat');doc.querySelector('.stat[data-status=""]').click();check(doc.querySelectorAll('.case-row').length===2,'Total did not clear filters');lines.push('PASS statistic buttons and dropdown share filtering, highlight and clear-all');
doc.getElementById('records-view').click();check(doc.getElementById('flow').hidden&&doc.getElementById('test-conclusion').hidden&&doc.querySelector('#record-history .record')&&doc.querySelector('#observation-form'),'Records did not separate history/execution from cases/summary');check(doc.querySelector('#record-history h3').textContent.includes('2 / 2'),'Record count wrong');
doc.getElementById('execution-panel').open=true;fill(doc.getElementById('observation-form'),'tester','Retained record draft');doc.getElementById('summary-view').click();check(!doc.getElementById('test-conclusion').hidden&&doc.getElementById('workspace').hidden&&doc.getElementById('flow').hidden&&!doc.querySelector('#observation-form'),'Summary mixed with record forms');const summary=doc.getElementById('test-conclusion').textContent;check(summary.includes('未通过')&&doc.querySelectorAll('.summary-table tbody tr').length===2,'Whole-round summary wrong');lines.push('PASS summary shows full-round verdict and case/environment evidence only');
doc.getElementById('records-view').click();check(doc.getElementById('observation-form').elements.tester.value==='Retained record draft','View switch lost draft');doc.querySelector('.stat[data-status=passed]').click();check(doc.querySelectorAll('#record-history .record').length===1,'Record filter not actual outcomes');doc.getElementById('summary-view').click();check(doc.getElementById('test-conclusion').textContent===summary,'Filter changed summary');lines.push('PASS record draft remains bound; summary independent of history filtering');
doc.querySelectorAll('.summary-table button')[1].click();check(doc.getElementById('case-list').textContent.includes('PROFILE01')&&new URLSearchParams(frame.contentWindow.location.hash.slice(1)).get('observation')==='EXAMPLE-PROFILE-FAIL'&&doc.getElementById('environment').value==='EXAMPLE-ENV','Summary link lost exact record/environment');lines.push('PASS summary evidence links bind exact observation and environment');
doc.getElementById('summary-view').click();const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.contentWindow.location.reload();await loaded;await until(()=>frame.contentDocument?.querySelector('.summary-table'));doc=frame.contentDocument;check(!doc.getElementById('test-conclusion').hidden&&doc.getElementById('workspace').hidden,'Reload lost summary view');lines.push('PASS summary deep links survive reload');
frame.contentWindow.location.hash='plan=EXAMPLE-PLAN&round=EXAMPLE-ROUND&case=PROFILE01&view=cases&environment=EXAMPLE-ENV&status=failed';await until(()=>doc.getElementById('status').value==='failed'&&doc.querySelectorAll('.case-row').length===1);check(doc.getElementById('case-list').textContent.includes('PROFILE01'),'Hash filter lost exact case');lines.push('PASS native hash navigation restores result filtering');
frame.contentWindow.location.hash='plan=EXAMPLE-PLAN&round=EXAMPLE-ROUND&case=PROFILE01&view=cases&observation=EXAMPLE-PROFILE-FAIL';await until(()=>doc.getElementById('view-title').textContent==='执行记录'&&doc.getElementById('environment').value==='EXAMPLE-ENV');check(doc.querySelector('#observation-EXAMPLE-PROFILE-FAIL'),'Legacy record link lost observation');lines.push('PASS legacy case-view observation links open matching record/environment');
frame.contentWindow.location.hash='plan=EXAMPLE-PLAN&round=EXAMPLE-ROUND&case=PROFILE01&view=records&environment=missing';await until(()=>doc.getElementById('detail').textContent.includes('环境不存在'));check(!doc.querySelector('#observation-form'),'Invalid environment exposed result form');doc.getElementById('round').value='EXAMPLE-ROUND';doc.getElementById('round').dispatchEvent(new Event('change'));lines.push('PASS invalid environment links expose no result mutation form');
doc.getElementById('cases-view').click();doc.querySelector('.stat[data-status=""]').click();const round=doc.getElementById('round');round.value='';round.dispatchEvent(new Event('change'));let editor=doc.querySelector('form.editor');editor.parentElement.open=true;fill(editor,'title','Retained definition draft');doc.getElementById('records-view').click();doc.getElementById('cases-view').click();check(doc.querySelector('form.editor').elements.title.value==='Retained definition draft','Definition draft lost');check(JSON.stringify(await read(db))===before,'Navigation or draft changed stored evidence');lines.push('PASS library drafts retained and all navigation/filtering remains read-only');
frame.style.width='390px';check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+1,'Mobile page overflows');lines.push('PASS narrow layout stays inside viewport');out.textContent=lines.join('\n')+'\nALL 11 SEPARATION CHECKS PASSED';
}catch(e){out.textContent=lines.join('\n')+'\nFAIL '+e.stack;}finally{db.close();}
</script>
