# For a project Skill, copy beside its SKILL.md as pr-review-loop.yml.
# In this repository: <project-root>/skills/pr-review-loop/pr-review-loop.yml.
# Add that exact path to the project's .gitignore by default. Remove the ignore
# rule and commit the file if the user wants project-wide shared settings.
# Do not bundle or sync either form into a general Agent install.
# An existing <project-root>/.pr-review-loop.yml on the PR base is a fallback.
# For a machine-wide Skill, generate beside the selected installed Skill as
# pr-review-loop.yml. Project scope applies to its own repository automatically.
# A project Skill with no adjacent policy does not inherit a machine-wide policy.
# PR changes to a tracked policy do not govern that same PR's review.
#
# Only a machine-wide Skill may fall back to:
#   $XDG_STATE_HOME/skill/pr-review-loop.yml
#   $HOME/.local/state/skill/pr-review-loop.yml (when XDG_STATE_HOME is unset)
# Its adjacent file takes priority.

# Independent PR comment switch. Only true enables comments. Machine-wide
# policies use the separate pr-review-loop.machine.example.yml template.
comment: false

# Completed review cycles. 0 = one read-only review, 1 = one review and its
# possible fix, 10 = at most ten reviews. A final pushed fix is not automatically
# considered re-reviewed. This setting does not enable PR comments.
max_rounds: 10

# Further attempts after a review could not run; failed attempts do not count
# toward max_rounds or imply a passing review.
review_retries: 3
