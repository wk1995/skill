# Example policy for pr-review-loop. Copy this file to the location that matches
# the scope you want to configure, then edit it.
#
# Project scope (governs one repository, versioned with it):
#   <project-root>/.pr-review-loop.yml
#
# Install scope (governs the install that is running):
#   <skill-dir>/pr-review-loop.yml
#   $XDG_STATE_HOME/skill/pr-review-loop.yml
#   $HOME/.local/state/skill/pr-review-loop.yml
#
# Commenting is off when no file decides, and both limits fall back to their
# defaults, so copying this example unchanged changes nothing.

# This scope's decision when no target below matches. Omit the key to leave the
# scope undecided and let the next source apply.
comment: false

# Repositories that receive comments, matched by git remote. A match beats the
# boolean above. Remotes are compared as host/owner/repo, case-insensitively,
# ignoring the scheme, any user@, a trailing slash, and a trailing .git, so all
# of these are the same target:
#   https://github.com/wk1995/skill.git
#   ssh://git@github.com/wk1995/skill
#   git@github.com:wk1995/skill.git
comment_targets:
  - https://github.com/wk1995/skill.git

# Rounds that may produce confirmed findings before the loop stops and explains
# why it needed that many. A round that passed and an attempt that failed are
# not counted. Omit the key to use the default of 10.
max_rounds: 10

# Further attempts allowed after a review attempt fails to run. Each retry must
# change the approach and record the failure; retries consume no round and post
# no comment. Omit the key to use the default of 3.
review_retries: 3
