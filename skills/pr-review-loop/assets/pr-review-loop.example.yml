# Example policy for pr-review-loop. Copy this file to the location that matches
# the scope you want to configure, then edit it.
#
# Project scope (governs one repository, versioned with it):
#   <project-root>/.pr-review-loop.yml
#
# Install scope: select a project Skill by metadata.sync_id first, then the
# machine-wide Skill only if no project Skill exists. A project Skill with no
# policy file does not inherit the machine-wide file.
#   <selected-skill-dir>/pr-review-loop.yml
# For the machine-wide Skill only, if its adjacent file is absent:
#   $XDG_STATE_HOME/skill/pr-review-loop.yml
#   $HOME/.local/state/skill/pr-review-loop.yml
#
# The two scopes use different file names and the same keys. Commenting is off
# unless one of them enables it: a repository that has a project-scope file is
# decided by that file, and the selected Skill install is read only for a
# repository that has none. If both machine-wide files exist, the adjacent file
# wins. Replace the placeholder target below with the intended repository;
# copying this example unchanged matches no real repository.

# This scope's decision when no target below matches. Only `true` enables
# commenting; omitting the key or writing `false` leaves commenting off.
comment: false

# Repositories that receive comments and can enter the full loop when the
# commenting account is also the pull-request author, matched by git remote.
# A match beats the boolean above. The remote must equal the PR's host/owner/repo;
# a fork's remote never matches. Remotes are compared case-insensitively,
# ignoring the scheme, any user@, a trailing slash, and a trailing .git, so all
# of these are the same target:
#   https://github.com/wk1995/skill.git
#   ssh://git@github.com/wk1995/skill
#   git@github.com:wk1995/skill.git
comment_targets:
  - https://github.com/<owner>/<repo>.git

# Rounds that may produce confirmed findings before the loop stops and explains
# why it needed that many. Checked before a round starts; a round that passed
# and an attempt that failed are not counted. Omit the key to use the default
# of 10.
max_rounds: 10

# Further attempts allowed after a review attempt fails to run. Each retry must
# change the approach and record the failure; retries consume no round and post
# no comment. Omit the key to use the default of 3.
review_retries: 3
