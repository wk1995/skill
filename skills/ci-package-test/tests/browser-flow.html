<!doctype html><meta charset="utf-8"><title>Flow and phone-location checks</title>
<h1>Disposable interactive flow fixture</h1><pre id="result">Running…</pre><iframe id="app" title="Flow fixture only" style="width:100%;height:1100px"></iframe>
<script type="module">
import {openStore,read,update} from '../assets/workbench/store.mjs';
import * as m from '../assets/workbench/model.mjs';
const workspace=`flow-test-${crypto.randomUUID()}`,db=await openStore(`ci-package-test-workbench:${workspace}`),frame=document.getElementById('app'),output=document.getElementById('result'),lines=[];
const require=(ok,message)=>{if(!ok)throw new Error(message);};
async function until(check){for(let i=0;i<300;i++){if(await check())return;await new Promise(resolve=>setTimeout(resolve,20));}throw new Error('Timed out');}
const at='2026-10-22T12:00:00Z',env=id=>({id,label:`Fixture phone ${id}`,kind:'mobile',configuration:'Disposable fixture; no device connected'});
const hint=screen=>({app:'fixture.app',screen,entryPath:['启动测试应用','打开指定页面'],targets:[{name:'测试按钮',by:'resource-id',value:'fixture.app:id/button',action:'核对当前页面后点击'}],verify:'检查实际截图中页面标题及所选手机'});
const item=(id,dependsOn=[])=>({id,title:`Fixture ${id}`,priority:'P0',types:id==='LOGIN'?['smoke']:['functional'],preconditions:'Fixture preconditions',steps:`Execute ${id}`,expected:`Expected ${id}`,dependsOn,testLocation:hint(`Fixture ${id} screen`)});
const p={id:'p',revision:0,version:'fixture-v',title:'Flow fixture only',source:'fixture-sha',build:'',pr:'',cases:[{...item('LOGIN'),next:{passed:{action:'test',caseId:'PAY',reason:'验证登录后的支付'},failed:{action:'retry',caseId:'LOGIN',reason:'保留失败证据后显式复测'},partial:{action:'retry',caseId:'LOGIN',reason:'补测未完成内容'},blocked:{action:'wait',reason:'等待外部条件',resumeWhen:'测试服务恢复'},skipped:{action:'done',reason:'结束当前分支'}}},item('CART'),item('PAY',['LOGIN','CART'])]};
function pass(s,id,suffix=''){s=m.startExecution(s,'r',{id:`start-${id}-${suffix}`,caseId:id,environmentId:'e',from:m.executionState(s.rounds[0],id,'e'),actor:'Fixture',at});return m.record(s,'r',{id:`result-${id}-${suffix}`,caseId:id,environmentId:'e',environment:env('e'),status:'passed',tester:'Fixture',executedAt:at,recordedAt:at,notes:'Disposable fixture observation',evidence:'Fixture evidence'});}
let doc;
const node=id=>[...doc.querySelectorAll('.flow-node')].find(button=>button.dataset.caseId===id);
const choose=id=>{const select=doc.getElementById('flow-environment');select.value=id;select.dispatchEvent(new Event('change'));};
async function external(action){const s=await read(db);await update(db,s.revision,current=>{const next=action(current);next.revision=current.revision+1;return next;});doc.getElementById('reload').click();await until(()=>!doc.getElementById('message').classList.contains('error'));}
try{
 const initial=await read(db);await update(db,initial.revision,state=>{let s=m.importPlan(state,p);s=m.createRound(s,{id:'r',planId:'p',name:'Flow fixture',createdAt:at,changedIds:[]});for(const id of ['e','f']){s=m.registerEnvironment(s,env(id));s=m.attachEnvironment(s,'r',id);}s=m.transitionRound(s,'r',{id:'ready',action:'prepare',from:'draft',actor:'Fixture',at});s=m.transitionRound(s,'r',{id:'run',action:'begin',from:'ready',actor:'Fixture',at});s=pass(s,'LOGIN');s.revision=state.revision+1;return s;});
 frame.src=`../assets/workbench/?workspace=${workspace}#plan=p&round=r&case=LOGIN`;await until(()=>frame.contentDocument?.getElementById('flow-environment'));doc=frame.contentDocument;
 require([...doc.querySelectorAll('.flow-node')].every(button=>button.dataset.state==='environment-required'),'Graph invented states without an environment');lines.push('PASS missing environment shows no inferred execution states');
 choose('e');require(node('LOGIN').dataset.state==='passed'&&node('CART').dataset.state==='untested','Wrong scoped states');require(node('LOGIN').classList.contains('current')&&node('CART').classList.contains('next'),'Current/next highlights missing');require(doc.querySelectorAll('.flow-edge.dependency').length===2&&doc.querySelectorAll('.flow-edge.next').length===2,'Dependency/routing edges mixed');const arrow=doc.querySelector('.flow-edge.next[data-to=PAY] path'),end=arrow.getPointAtLength(arrow.getTotalLength());require(end.x<parseFloat(node('PAY').style.left)&&end.x>=parseFloat(node('PAY').style.left)-8,'Forward route arrow terminates behind target node');require(doc.getElementById('flow-next').textContent.includes('CART')&&doc.getElementById('flow-next').textContent.includes('Execute CART'),'Concrete prerequisite advice missing');lines.push('PASS dependency/next edges, states, current case and concrete prerequisite guidance');
 const tester=doc.getElementById('observation-form').elements.tester;tester.value='Fixture retained draft';tester.dispatchEvent(new Event('input',{bubbles:true}));const before=await read(db);node('PAY').click();require(doc.getElementById('start-execution').disabled,'Graph navigation bypassed dependency start guard');require(doc.getElementById('environment').value==='e','Graph lost selected environment');require(JSON.stringify(await read(db))===JSON.stringify(before),'Graph navigation mutated archive');
 const search=doc.getElementById('search');search.value='LOGIN';search.dispatchEvent(new Event('input'));node('CART').click();require(doc.getElementById('search').value===''&&node('CART').classList.contains('current'),'Graph navigation failed under list filter');lines.push('PASS graph buttons navigate through filters, retain environment and never start/save outcomes');
 choose('f');require(node('LOGIN').dataset.state==='untested','Another device pass leaked into selected environment');choose('e');node('LOGIN').click();require(doc.getElementById('observation-form').elements.tester.value==='Fixture retained draft','Graph navigation/environment change lost bound draft');lines.push('PASS environment selector isolates current states and synchronizes detail selection');
 let copied='';Object.defineProperty(frame.contentWindow.navigator,'clipboard',{configurable:true,value:{writeText:async value=>{copied=value;}}});const copyBefore=await read(db);doc.getElementById('copy-test-location').click();await until(()=>copied.length>0);for(const token of ['fixture-v','fixture-sha','p / r / e','Fixture phone e','Disposable fixture; no device connected','LOGIN','fixture.app:id/button','Execute LOGIN','Expected LOGIN','未核对当前设备界面'])require(copied.includes(token),`Missing handoff ${token}`);require(JSON.stringify(await read(db))===JSON.stringify(copyBefore),'Copy mutated data');lines.push('PASS phone handoff contains source/round/environment, page/selector/steps and unverified-screen notice');
 await external(s=>pass(s,'CART'));await until(()=>node('PAY').classList.contains('next'));require(doc.querySelector('.flow-edge.next.active')?.dataset.to==='PAY','Available outcome route not highlighted');require(doc.getElementById('flow-next').textContent.includes('Execute PAY'),'PAY next guidance missing');const ai=m.exportAI(await read(db));require(ai.projection.rounds[0].executions.find(item=>item.caseId==='LOGIN'&&item.environmentId==='e').nextTest.targetCaseId==='PAY','AI/UI guidance differs');lines.push('PASS saved prerequisite pass updates next node/branch and matches AI guidance');
 await external(s=>pass(pass(s,'PAY'),'LOGIN','again'));await until(()=>node('PAY').textContent.includes('证据已过期'));node('PAY').click();require(doc.getElementById('flow-next').textContent.includes('重新验证'),'Stale dependent pass not shown for retest');lines.push('PASS upstream retest marks descendant evidence stale and recommends fresh validation');
 const round=doc.getElementById('round');round.value='';round.dispatchEvent(new Event('change'));node('LOGIN').click();let editor=doc.querySelector('form.editor');editor.parentElement.open=true;const saved=await read(db);const invalid=hint('Bad');invalid.targets[0].by='coordinates';editor.elements.testLocation.value=JSON.stringify(invalid);editor.querySelector('button').click();await until(()=>doc.getElementById('message').classList.contains('error'));require(JSON.stringify(await read(db))===JSON.stringify(saved),'Invalid locator persisted');
 const safe=hint('<img src=x onerror=alert(1)>');editor.elements.testLocation.value=JSON.stringify(safe);editor.querySelector('button').click();await until(async()=>(await read(db)).plans[0].cases[0].testLocation.screen===safe.screen);require(doc.getElementById('test-location').textContent.includes(safe.screen)&&!doc.querySelector('#test-location img'),'Hint executed markup');require((await read(db)).rounds[0].cases.find(item=>item.id==='LOGIN').testLocation.screen==='Fixture LOGIN screen','Current editor changed historical locator');lines.push('PASS locator editor rejects atomically, renders safe text and preserves frozen round hints');
 frame.style.width='390px';await new Promise(resolve=>setTimeout(resolve,100));require(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+1,'Mobile viewport has page-wide overflow');require(doc.querySelector('.flow-scroll').scrollWidth>doc.querySelector('.flow-scroll').clientWidth,'Wide diagram cannot be scrolled');lines.push('PASS narrow viewport keeps wide graph inside a scrollable panel');
 output.textContent=lines.join('\n')+'\nALL 9 FLOW CHECKS PASSED';
}catch(error){output.textContent=lines.join('\n')+'\nFAIL '+error.stack;}finally{db.close();}
</script>
