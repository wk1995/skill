<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Testflow · 测试工作台</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div><span class="eyebrow">CI PACKAGE TEST</span><h1>Testflow <span>测试工作台</span></h1></div>
    <div class="actions"><button id="import-button" type="button">导入方案 / 归档</button><input id="import" type="file" accept=".json,application/json" hidden><button id="export">导出归档</button><button id="reload">刷新数据</button></div></header>
  <p id="message" role="status" aria-live="polite"></p>
  <div class="layout"><aside>
    <label>版本<select id="version" aria-label="版本"></select></label><label>测试方案<select id="plan" aria-label="测试方案"></select></label><label>测试轮次<select id="round" aria-label="测试轮次"></select></label>
    <div id="identity" class="identity"></div>
    <details><summary>粘贴 JSON 导入</summary><form id="json-form"><label>方案或归档 JSON<textarea name="json" required></textarea></label><button>校验并导入</button></form></details>
    <details><summary>准备下一轮</summary><form id="round-form"><label>轮次名称<input name="name" required placeholder="第二轮回归"></label><label>变更用例 ID<input name="changed" placeholder="CASE01, CASE02"></label><small>首轮留空纳入全部；后续留空仍包含失败和冒烟。</small><label class="check"><input name="unfinished" type="checkbox">也纳入上轮未完成</label><button class="primary">创建测试轮次</button></form></details>
    <details><summary>登记可复用环境 / 设备</summary><form id="environment-form"><label>名称<input name="label" required placeholder="Chrome / 测试机 A"></label><label>环境类型<select name="kind"><option value="browser">浏览器</option><option value="mobile">移动设备</option><option value="desktop">桌面</option><option value="service">服务</option><option value="library">库 / 运行时</option><option value="other">其他</option></select></label><label>配置快照<textarea name="configuration" required placeholder="系统、版本、型号、运行时、部署地址等"></textarea></label><button>登记环境</button></form></details>
    <p class="storage">数据保存在此浏览器的 IndexedDB。导出可备份或迁移；当前模板不提供多人同步。</p>
  </aside><main><section id="stats" class="stats"></section>
    <div class="actions view-actions"><button id="cases-view">测试用例</button><button id="records-view">执行记录</button><button id="copy-results">复制本轮结果</button></div>
    <section class="workspace"><div class="cases"><div class="filters"><input id="search" aria-label="搜索用例" placeholder="搜索编号或标题"><select id="type" aria-label="测试类型"></select><select id="status" aria-label="结果筛选"></select></div><nav id="case-list" aria-label="测试用例"></nav></div>
      <article id="detail"></article></section>
  </main></div>
  <script type="module" src="app.mjs"></script>
</body></html>
